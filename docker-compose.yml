version: '3.8'

services:
  kali-desktop:
    build: .
    container_name: kali-lxqt-desktop
    shm_size: '2gb' 
    ports:
      - "8080:8080"
    environment:
      - VNC_RESOLUTION=1920x1080
      - VNC_PASSWORD=${VNC_PASSWORD:-kali123} 
    restart: unless-stopped
    volumes:
      - kali_data:/root 

volumes:
  kali_data:
