version: '3.8'

services:
  mini-pc-core:  # Name changed back to match your domain config
    build: .
    container_name: kali-lxqt-desktop
    shm_size: '2gb' 
    ports:
      - "8080:8080"
    environment:
      - VNC_RESOLUTION=1920x1080
      - VNC_PASSWORD=${VNC_PASSWORD:-kali123}
      - LIBGL_ALWAYS_SOFTWARE=1
    restart: unless-stopped
    volumes:
      - kali_data:/root 

volumes:
  kali_data:
