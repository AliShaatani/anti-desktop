version: '3.8'

services:
  mini-pc-core:
    build: .
    container_name: lxqt-core-desktop
    # shm_size handles the Chrome crashing issue during intense programming sessions
    shm_size: '2gb' 
    ports:
      - "8080:8080"
    environment:
      - VNC_RESOLUTION=1920x1080
    restart: unless-stopped
    volumes:
      # Persists your workspace inside Dokploy
      - workspace_data:/root 

volumes:
  workspace_data:
